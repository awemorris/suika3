name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows-vs2026:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for Visualt Studio
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          cmake --preset windows-vs2026-x86
          cmake --build --preset windows-vs2026-x86 --config Release
          cp out/build/windows-vs2026-x86/Release/suika3.exe suika3-win32.exe

          cmake --preset windows-vs2026-x64
          cmake --build --preset windows-vs2026-x64 --config Release
          cp out/build/windows-vs2026-x64/Release/suika3.exe suika3-win64.exe
          cp out/build/windows-vs2026-x64/Release/suika3-aotc.exe suika3-aotc.exe
          cp out/build/windows-vs2026-x64/Release/suika3-bcc.exe suika3-bcc.exe
          cp out/build/windows-vs2026-x64/Release/suika3-pack.exe suika3-pack.exe
          cp out/build/windows-vs2026-x64/Release/suika3-web.exe suika3-web.exe

          cmake --preset windows-vs2026-x64-console
          cmake --build --preset windows-vs2026-x64-console --config Release
          cp out/build/windows-vs2026-x64-console/Release/suika3.exe suika3-cli.exe

          cmake --preset windows-vs2026-arm64
          cmake --build --preset windows-vs2026-arm64 --config Release
          cp out/build/windows-vs2026-arm64/Release/suika3.exe suika3-arm64.exe

      - name: Upload Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            suika3-win32.exe
            suika3-win64.exe
            suika3-arm64.exe
            suika3-cli.exe
            suika3-aotc.exe
            suika3-bcc.exe
            suika3-pack.exe
            suika3-web.exe
          if-no-files-found: error
          retention-days: 7

  build-windows-mingw-w64:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for MinGW-w64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download mingw-w64-11.0
        run: |
          echo "Downloading mingw-w64-11.0 with a MSVCRT/XP configuration."
          wget -q https://github.com/awemorris/suika3/releases/download/CI-BASE/mingw-w64-11.0.tar.bz2
          tar xJf mingw-w64-11.0.tar.bz2
          echo "$PWD/mingw-w64-11.0/bin" >> $GITHUB_PATH

      - name: Build for mingw-w64 i686
        run: |
          cmake --preset windows-mingw-x86
          cmake --build --preset windows-mingw-x86
          i686-w64-mingw32-strip build-mingw-x86/suika3.exe
          cp build-mingw-x86/suika3.exe suika3-win32.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mingw
          path: |
            suika3-win32.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for macOS and iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup for macOS
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build for macOS
        run: |
          cmake --preset macos
          cmake --build --preset macos

          cmake --preset macos-lib
          cmake --build --preset macos-lib

          cmake --preset macos-cli
          cmake --build --preset macos-cli

      - name: Build for iOS
        run: |
          cmake --preset ios-device
          cmake --build --preset ios-device

          cmake --preset ios-simulator
          cmake --build --preset ios-simulator

      - name: Build macOS dmg
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SECRET: ${{ secrets.APP_PASSWORD }}
        run: |
          cd build-macos
          codesign --timestamp --options runtime --entitlements ../resources/macos/macos.entitlements --deep --force --sign "Developer ID Application" Suika3.app
          ditto -c -k --sequesterRsrc --keepParent Suika3.app Suika3.zip
          xcrun notarytool submit Suika3.zip --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SECRET" --wait
          xcrun stapler staple Suika3.app
          mkdir tmp
          cp -Rv Suika3.app tmp/Suika3.app
          hdiutil create -fs HFS+ -format UDBZ -srcfolder tmp -volname Suika3 Suika3.dmg
          codesign --sign "Developer ID Application" Suika3.dmg
          cd ..
          mv build-macos/Suika3.dmg .

      - name: Build macOS/iOS XCFramework
        run: |
          xcodebuild \
            -create-xcframework \
            -library build-macos-lib/libsuika3.a -headers include \
            -library build-ios-device/libsuika3.a -headers include \
            -library build-ios-simulator/libsuika3.a -headers include \
            -output Suika3.xcframework

      - name: Build macOS project
        run: |
          cp -R resources/projects/macos macos
          mkdir macos/Resources
          mkdir macos/Resources/video
          cp -R Suika3.xcframework macos/Game/
          cp resources/assets.arc macos/Resources/
          zip -r Suika3-macOS-Xcode.zip macos

      - name: Build iOS project
        run: |
          cp -R resources/projects/ios ios
          mkdir ios/Resources
          mkdir ios/Resources/video
          cp -R Suika3.xcframework ios/Game/
          cp resources/assets.arc ios/Resources/
          zip -r Suika3-iOS-Xcode.zip ios

      - name: Build macOS tar.gz
        run: |
          mkdir -p out
          mkdir -p out/bin
          mkdir -p out/share/man/man1
          cp build-macos-cli/suika3 out/bin/
          cp build-macos-cli/suika3-pack out/bin/
          cp build-macos-cli/suika3-aotc out/bin/
          cp build-macos-cli/suika3-bcc out/bin/
          cp resources/manpage/suika3.1 out/share/man/man1/
          cd out
          tar czf ../suika3-macos-universal.tar.gz *
          cd ..

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Suika3.dmg
            Suika3-macOS-Xcode.zip
            Suika3-iOS-Xcode.zip
            suika3-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-flatpak-x86_64:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for Flatpak x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Build flatpak
        run: |
          yes | flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//25.08
          flatpak install --user -y flathub org.freedesktop.Platform//25.08
          flatpak install --user -y flathub org.freedesktop.Platform.GStreamer.openmpt//25.08
          flatpak-builder --user -y --repo=myrepo --force-clean build-dir-x86_64 ./resources/flatpak/vn.suika3.engine.yml
          flatpak build-bundle myrepo Suika3-x86_64.flatpak vn.suika3.engine --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: |
            Suika3-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7

  build-flatpak-aarch64:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Build flatpak
        run: |
          yes | flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//25.08
          flatpak install --user -y flathub org.freedesktop.Platform//25.08
          flatpak install --user -y flathub org.freedesktop.Platform.GStreamer.openmpt//25.08
          flatpak-builder --user -y --repo=myrepo --force-clean build-dir-aarch64 ./resources/flatpak/vn.suika3.engine.yml
          flatpak build-bundle myrepo Suika3-aarch64.flatpak vn.suika3.engine --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-aarch64
          path: |
            Suika3-aarch64.flatpak
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for Wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup for Wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build for Wasm
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
          cp build-wasm/index.html ./  

      - name: Upload Wasm
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            index.html
          if-no-files-found: error
          retention-days: 7

  build-android:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build openjdk-17-jdk gradle

      - name: Setup for Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build shared libraries
        run: |
          cmake --preset android-arm64
          cmake --build --preset android-arm64
          cmake --preset android-armv7
          cmake --build --preset android-armv7
          cmake --preset android-x86_64
          cmake --build --preset android-x86_64
          cmake --preset android-x86
          cmake --build --preset android-x86
          cmake --preset android-riscv64
          cmake --build --preset android-riscv64

      - name: Build class files
        run: |
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          mkdir classes
          javac -d classes -cp $ANDROID_JAR external/PlayfieldEngine/external/StratoHAL/src/MainActivity.java
          ls -l classes

      - name: Build AAR
        run: |
          # Make directory tree.
          mkdir -p aar_out/prefab/modules/suika3/include
          mkdir -p aar_out/prefab/modules/suika3/libs/android.arm64-v8a
          mkdir -p aar_out/prefab/modules/suika3/libs/android.armeabi-v7a
          mkdir -p aar_out/prefab/modules/suika3/libs/android.x86_64
          mkdir -p aar_out/prefab/modules/suika3/libs/android.x86
          mkdir -p aar_out/prefab/modules/suika3/libs/android.riscv64

          # Make the JAR file.
          cd classes
          jar cvf ../aar_out/classes.jar *
          cd ..

          # Copy the header files.
          cp -R include/suika3 aar_out/prefab/modules/suika3/include/
          cp -R external/PlayfieldEngine/include/playfield aar_out/prefab/modules/suika3/include/
          cp -R external/PlayfieldEngine/external/NoctLang/include/noct aar_out/prefab/modules/suika3/include/
          cp -R external/PlayfieldEngine/external/StratoHAL/include/strato aar_out/prefab/modules/suika3/include/

          # Copy libsuika3.a.
          cp build-android-arm64/libsuika3.a aar_out/prefab/modules/suika3/libs/android.arm64-v8a/suika3.a
          cp build-android-armv7/libsuika3.a aar_out/prefab/modules/suika3/libs/android.armeabi-v7a/suika3.a
          cp build-android-x86_64/libsuika3.a aar_out/prefab/modules/suika3/libs/android.x86_64/suika3.a
          cp build-android-x86/libsuika3.a aar_out/prefab/modules/suika3/libs/android.x86/suika3.a
          cp build-android-riscv64/libsuika3.a aar_out/prefab/modules/suika3/libs/android.riscv64/suika3.a

          # Copy the default resource.
          cp -R resources/android/res aar_out/

          # Copy meta data.
          cp resources/android/AndroidManifest.xml aar_out/AndroidManifest.xml
          cp resources/android/prefab.json aar_out/prefab/
          cp resources/android/module.json aar_out/prefab/modules/suika3/
          echo '{"abi": "arm64-v8a",   "api": 21, "ndk": 27, "stl": "none", "static": true}' > aar_out/prefab/modules/suika3/libs/android.arm64-v8a/abi.json
          echo '{"abi": "armeabi-v7a", "api": 21, "ndk": 27, "stl": "none", "static": true}' > aar_out/prefab/modules/suika3/libs/android.armeabi-v7a/abi.json
          echo '{"abi": "x86_64",      "api": 21, "ndk": 27, "stl": "none", "static": true}' > aar_out/prefab/modules/suika3/libs/android.x86_64/abi.json
          echo '{"abi": "x86",         "api": 21, "ndk": 27, "stl": "none", "static": true}' > aar_out/prefab/modules/suika3/libs/android.x86/abi.json
          echo '{"abi": "riscv64",     "api": 21, "ndk": 27, "stl": "none", "static": true}' > aar_out/prefab/modules/suika3/libs/android.riscv64/abi.json

          # Make an AAR file.
          cd aar_out
          zip -r ../Suika3.aar *
          cd ..

      - name: Build project
        run: |
          # Copy the project template.
          cp -R resources/projects/android android

          # Copy the AAR.
          mkdir -p android/app/libs
          cp Suika3.aar android/app/libs

          # Copy the sample game assets.
          mkdir -p android/app/src/main/assets
          cp -R game/* android/app/src/main/assets/

          # Replace the font file to a smaller one.
          cp resources/launcher/system/font/NotoSans-Medium.ttf android/app/src/main/assets/system/font/NotoSansCJK-Medium.ttc

          # Make a ZIP file.
          zip -r Suika3-Android-Studio.zip android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Suika3-Android-Studio.zip
          if-no-files-found: error
          retention-days: 7

  build-openharmony:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for OpenHarmony
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison

      - name: Download OpenHarmony SDK
        run: |
          echo "Downloading openharmony-native.tar.gz"
          wget -q https://github.com/awemorris/suika3/releases/download/CI-BASE/openharmony-native.tar.gz
          tar xzf openharmony-native.tar.gz

      - name: Build for OpenHarmony
        run: |
          OH_NATIVE_SDK_ROOT="$PWD/openharmony-sdk-native" cmake --preset openharmony-arm64
          OH_NATIVE_SDK_ROOT="$PWD/openharmony-sdk-native" cmake --build --preset openharmony-arm64
          OH_NATIVE_SDK_ROOT="$PWD/openharmony-sdk-native" cmake --preset openharmony-x86_64
          OH_NATIVE_SDK_ROOT="$PWD/openharmony-sdk-native" cmake --build --preset openharmony-x86_64

      - name: Build project
        run: |
          cp -R resources/projects/openharmony ./

          mkdir -p openharmony/entry/src/main/cpp/third_party/suika3/include/
          cp -R include/suika3 openharmony/entry/src/main/cpp/third_party/suika3/include/
          cp -R external/PlayfieldEngine/include/playfield openharmony/entry/src/main/cpp/third_party/suika3/include/
          cp -R external/PlayfieldEngine/external/NoctLang/include/noct openharmony/entry/src/main/cpp/third_party/suika3/include/
          cp -R external/PlayfieldEngine/external/StratoHAL/include/strato openharmony/entry/src/main/cpp/third_party/suika3/include/

          mkdir -p openharmony/entry/src/main/cpp/third_party/suika3/lib/arm64-v8a
          cp build-openharmony-arm64/libsuika3.a openharmony/entry/src/main/cpp/third_party/suika3/lib/arm64-v8a/

          mkdir -p openharmony/entry/src/main/cpp/third_party/suika3/lib/x86_64
          cp build-openharmony-x86_64/libsuika3.a openharmony/entry/src/main/cpp/third_party/suika3/lib/x86_64/

          mkdir -p openharmony/entry/src/main/resources/rawfile/
          cp -R game/* openharmony/entry/src/main/resources/rawfile/
          cp resources/launcher/system/font/NotoSans-Medium.ttf openharmony/entry/src/main/resources/rawfile/system/font/NotoSansCJK-Medium.ttc

          zip -r Suika3-OpenHarmony-DevEco.zip openharmony

      - name: Upload OpenHarmony artifact
        uses: actions/upload-artifact@v4
        with:
          name: openharmony
          path: |
            Suika3-OpenHarmony-DevEco.zip
          if-no-files-found: error
          retention-days: 7

  build-unity:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for Unity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM
        id: cache-llvm-21-v1
        uses: actions/cache@v4
        with:
          path: llvm-21
          key: llvm-21

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison mingw-w64

      - name: Setup LLVM for Unity
        if: steps.cache-llvm-21-v1.outputs.cache-hit != 'true'
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz
          mkdir llvm-21 && tar -xJf llvm.tar.xz -C llvm-21 --strip-components=1

      - name: Setup PATH for LLVM
        run: |
          $(pwd)/llvm-21/bin/clang --version
          echo $(pwd)/llvm-21/bin >> $GITHUB_PATH

      - name: Build for Unity
        run: |
          clang --version
          cmake --preset unity-win64
          cmake --build --preset unity-win64
          cmake --preset unity-switch
          cmake --build --preset unity-switch
          cmake --preset unity-ps5
          cmake --build --preset unity-ps5
          cmake --preset unity-xbox
          cmake --build --preset unity-xbox

      - name: Built project
        run: |
          mkdir unity
          mkdir unity/Assets

          mkdir unity/Assets/StreamingAssets
          cp -R game/* unity/Assets/StreamingAssets/
          cp resources/launcher/system/font/NotoSans-Medium.ttf unity/Assets/StreamingAssets/system/font/NotoSansCJK-Medium.ttc

          mkdir unity/Assets/Resources
          cp external/PlayfieldEngine/external/StratoHAL/src/StratoScript.cs      unity/Assets/
          cp external/PlayfieldEngine/external/StratoHAL/src/NormalShader.shader  unity/Assets/Resources/
          cp external/PlayfieldEngine/external/StratoHAL/src/AddShader.shader     unity/Assets/Resources/
          cp external/PlayfieldEngine/external/StratoHAL/src/DimShader.shader     unity/Assets/Resources/
          cp external/PlayfieldEngine/external/StratoHAL/src/RuleShader.shader    unity/Assets/Resources/
          cp external/PlayfieldEngine/external/StratoHAL/src/MeltShader.shader    unity/Assets/Resources/
          cp external/PlayfieldEngine/external/StratoHAL/src/MainScene.unity      unity/Assets/

          mkdir unity/Assets/Plugins
          mkdir unity/Assets/Plugins/x86_64
          mkdir unity/Assets/Plugins/Switch
          mkdir unity/Assets/Plugins/PS5
          mkdir unity/Assets/Plugins/GameCoreXboxSeries
          mkdir unity/Assets/Plugins/Common
          cp build-unity-win64/libsuika3.dll unity/Assets/Plugins/x86_64/libstrato.dll
          cp build-unity-switch/libsuika3.a  unity/Assets/Plugins/Switch/libsuika3.a
          cp build-unity-ps5/libsuika3.a     unity/Assets/Plugins/PS5/libsuika3.a
          cp build-unity-xbox/suika3.lib     unity/Assets/Plugins/GameCoreXboxSeries/suika3.lib

          cp docs/readme/unity.md unity/

          zip -r Suika3-Unity.zip unity

      - name: Upload Unity artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity
          path: |
            Suika3-Unity.zip
          if-no-files-found: error
          retention-days: 7

  build-pc98:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for NEC PC-9801
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Cache Watcom
        id: cache-watcom
        uses: actions/cache@v4
        with:
          path: openwatcom-1.9
          key: openwatcom-1.9

      - name: Configure OpenWatcom
        if: steps.cache-watcom.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/awemorris/suika3/releases/download/CI-BASE/openwatcom-1.9.tar.gz
          tar xzf openwatcom-1.9.tar.gz

      - name: Build
        run: |
          export WATCOM="$PWD/openwatcom-1.9"
          export INCLUDE="$WATCOM/h"
          export EDPATH="$WATCOM/eddat"
          export PATH="$WATCOM/binl:$WATCOM/binw:$PATH"
          echo "$WATCOM"
          ls -lha "$WATCOM/binl"
          command -v wcl386 || true
          command -v wlink || true
          cmake --preset pc98
          cmake --build --preset pc98
          mv build-pc98/suika3.exe suika-98.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pc98
          path: suika-98.exe

  build-pcat:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build for IBM PC/AT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Cache Watcom
        id: cache-watcom
        uses: actions/cache@v4
        with:
          path: openwatcom-1.9
          key: openwatcom-1.9

      - name: Configure OpenWatcom
        if: steps.cache-watcom.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/awemorris/suika3/releases/download/CI-BASE/openwatcom-1.9.tar.gz
          tar xzf openwatcom-1.9.tar.gz

      - name: Build
        run: |
          export WATCOM="$PWD/openwatcom-1.9"
          export INCLUDE="$WATCOM/h"
          export EDPATH="$WATCOM/eddat"
          export PATH="$WATCOM/binl:$WATCOM/binw:$PATH"
          echo "$WATCOM"
          ls -lha "$WATCOM/binl"
          command -v wcl386 || true
          command -v wlink || true
          cmake --preset pcat
          cmake --build --preset pcat
          mv build-pcat/suika3.exe suika-at.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pcat
          path: suika-at.exe

  build-mkdocs:
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    name: Build documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mkdocs-material

      - name: Run mkdocs
        run: |
          cd docs/mkdocs-en
          mkdocs build
          mv site documents
          zip -r ../../Suika3-documents.zip documents

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs
          path: |
            Suika3-documents.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[docs]')
    needs:
      - build-windows-vs2026
      - build-windows-mingw-w64
      - build-macos
      - build-flatpak-x86_64
      - build-flatpak-aarch64
      - build-wasm
      - build-android
      - build-openharmony
      - build-unity
      - build-pc98
      - build-pcat
      - build-mkdocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make the target directory
        run: |
          mkdir dist
          mkdir dist/SDK
          mkdir dist/SDK/windows
          mkdir dist/SDK/macos
          mkdir dist/SDK/macos/project
          mkdir dist/SDK/linux
          mkdir dist/SDK/wasm
          mkdir dist/SDK/ios
          mkdir dist/SDK/android
          mkdir dist/SDK/openharmony
          mkdir dist/SDK/unity

      - name: Copy the sample game
        run: |
          cp -R game/.vscode dist/
          cp game/main.ray dist/
          cp game/start.novel dist/
          cp game/config.ini dist/
          cp -R game/images dist/
          cp -R game/sound dist/
          cp -R game/system dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows

      - name: Download mingw artifacts
        uses: actions/download-artifact@v4
        with:
          name: mingw
          path: mingw

      - name: Copy for Windows
        run: |
          cp windows/suika3-win64.exe   dist/
          cp windows/suika3-win64.exe   dist/SDK/windows/suika3-win64.exe
          cp mingw/suika3-win32.exe     dist/SDK/windows/suika3-win32.exe
          cp windows/suika3-pack.exe    dist/SDK/windows/
          cp windows/suika3-web.exe     dist/SDK/wasm/
          cp windows/suika3-arm64.exe   dist/SDK/windows/suika3-arm64.exe
          cp windows/suika3-cli.exe   dist/SDK/windows/suika3-cli.exe

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - name: Copy for macOS
        run: |
          cp macos/Suika3.dmg dist/SDK/macos/

          unzip macos/Suika3-macOS-Xcode.zip -d dist/SDK/macos/
          mv dist/SDK/macos/macos dist/SDK/macos/project

          mkdir dist/SDK/macos/root
          tar xzf macos/suika3-macos-universal.tar.gz -C dist/SDK/macos/root

          cp dist/SDK/macos/root/bin/suika3-aotc    dist/SDK/macos/
          cp dist/SDK/macos/root/bin/suika3-bcc     dist/SDK/macos/
          cp dist/SDK/macos/root/bin/suika3-pack    dist/SDK/macos/
          cp resources/macos/suika3-wrapper.sh      dist/SDK/macos/

      - name: Copy for iOS
        run: |
          unzip macos/Suika3-iOS-Xcode.zip -d dist/SDK

      - name: Download Flatpak x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: flatpak-x86_64
          path: flatpak-x86_64

      - name: Download Flatpak aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: flatpak-aarch64
          path: flatpak-aarch64

      - name: Copy for Linux
        run: |
          cp flatpak-x86_64/Suika3-x86_64.flatpak dist/SDK/linux/
          cp flatpak-aarch64/Suika3-aarch64.flatpak dist/SDK/linux/
          cp resources/linux/suika3-wrapper.sh dist/SDK/linux/

      - name: Download wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: wasm

      - name: Copy for Wasm.
        run: |
          cp wasm/index.html dist/SDK/wasm/
          cp resources/assets.arc dist/SDK/wasm/
          cp wasm/index.html suika3-wasm.html

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Copy for Android
        run: |
          unzip android/Suika3-Android-Studio.zip -d dist/SDK

      - name: Download OpenHarmony artifacts
        uses: actions/download-artifact@v4
        with:
          name: openharmony
          path: openharmony

      - name: Copy for OpenHarmony
        run: |
          unzip openharmony/Suika3-OpenHarmony-DevEco.zip -d dist/SDK

      - name: Download Unity artifacts
        uses: actions/download-artifact@v4
        with:
          name: unity
          path: unity

      - name: Copy for Unity
        run: |
          unzip unity/Suika3-Unity.zip -d dist/SDK

      - name: Download mkdocs artifacts
        uses: actions/download-artifact@v4
        with:
          name: mkdocs
          path: mkdocs

      - name: Download PC98 artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc98
          path: pc98

      - name: Copy for PC98
        run: |
          mkdir dist/SDK/msdos
          cp pc98/suika-98.exe dist/SDK/msdos/

      - name: Download PC/AT artifacts
        uses: actions/download-artifact@v4
        with:
          name: pcat
          path: pcat

      - name: Copy for PC/AT
        run: |
          mkdir -p dist/SDK/msdos
          cp pcat/suika-at.exe dist/SDK/msdos/

      - name: Copy documents
        run: |
          unzip mkdocs/Suika3-documents.zip -d dist/SDK
          cp README.md dist/SDK/

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Make documents
        run: |
          mv dist Suika3
          7z a -tzip -mx=9 Suika3-SDK-Full.zip Suika3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: CI-${{ env.DATE }}-${{ env.SHORT_SHA }}
          name: Suika3-CI-${{ env.DATE }}-${{ env.SHORT_SHA }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.
            
            <div align="center">
              <img src="https://raw.githubusercontent.com/awemorris/suika3/refs/heads/main/docs/img/logo-mid.png" width="320"><br>
              <br>
            </div>
            
            | OS                          | File                            | Type                       | Description                      |
            |-----------------------------|---------------------------------|----------------------------|----------------------------------|
            | Full                        | Suika3-Full-SDK.zip             | ZIP                        | Full Distribution                |
            | Documents                   | suika3-documents.zip            | ZIP                        | Documents                        |
            | Windows 64-bit Intel        | suika3-win64.exe                | Windows Executable         | Windows 7+ 64-bit                |
            | Windows 64-bit Arm          | suika3-arm64.exe                | Windows Executable         | Windows 10+ Arm64                |
            | Windows 32-bit Intel        | suika3-win32.exe                | Windows Executable         | Windows XP+ 32-bit               |
            | Windows CLI                 | suika3-cli.exe                  | Windows Executable         | Windows 7+ 64-bit                |
            | macOS 10.11+                | Suika3.dmg                      | macOS App                  | macOS 10.11+ App                 |
            | macOS CLI                   | suika3-macos-universal.tar.gz   | macOS CLI                  | macOS binary set                 |
            | macOS (Xcode)               | Suika3-macOS-Xcode.zip          | Xcode Project              | macOS Xcode Project              |
            | Linux x86_64                | Suika3-x86_64.flatpak           | Flatpak Package            | Linux Flatpak x86_64             |
            | Raspberry Pi 3+             | Suika3-aarch64.flatpak          | Flatpak Package            | Linux Flatpak aarch64            |
            | iOS (Xcode)                 | Suika3-iOS-Xcode.zip            | Xcode Project              | macOS Xcode Project              |
            | Android (Android Studio)    | Suika3-Android-Studio.zip       | Android Studio Project     | Android NDK                      |
            | OpenHarmony (DevEco Studio) | Suika3-OpenHarmony-DevEco.zip   | OpenHarmony DevEco Project | OpenHarmony (HarmonyOS NEXT)     |
            | Wasm (HTML)                 | suika3-wasm.html                | Wasm                       | Emscripten Binary                |
            | Wasm (Emscripten Lib)       | suika3-wasm.tar.gz              | Tarball                    | Emscripten Headers and Libraries |
            | Unity (Console)             | Suika3-Unity.zip                | Unity Plugin + Project     | Unity (Win64/Switch/PS5/Xbox)    |
            | NEC PC-9801                 | suika-98.exe                    | MS-DOS Executable          | NEC PC-9801 DOS4G (80386)        |
            | IBM PC/AT                   | suika-at.exe                    | MS-DOS Executable          | IBM PC/AT DOS4G (80386)          |

          files: |
            Suika3-SDK-Full.zip
            windows/suika3-win64.exe
            mingw/suika3-win32.exe
            windows/suika3-arm64.exe
            windows/suika3-cli.exe
            macos/Suika3.dmg
            macos/Suika3-macOS-Xcode.zip
            macos/suika3-macos-universal.tar.gz
            flatpak-x86_64/Suika3-x86_64.flatpak
            flatpak-aarch64/Suika3-aarch64.flatpak
            macos/Suika3-iOS-Xcode.zip
            android/Suika3-Android-Studio.zip
            openharmony/Suika3-OpenHarmony-DevEco.zip
            wasm/suika3-wasm.html
            wasm/suika3-wasm.tar.gz
            unity/Suika3-Unity.zip
            pc98/suika-98.exe
            pcat/suika-at.exe
